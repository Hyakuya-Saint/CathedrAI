name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp release tag to build the engine from (e.g. b6200)"
        required: false
      arm_arch:
        description: "CPU target. Default armv8.2-a+dotprod; use armv8-a for very old phones, armv8.6-a+dotprod+i8mm for new flagships"
        required: false
env:
  LLAMA_TAG: ${{ inputs.llama_tag || vars.LLAMA_TAG || 'b6200' }}
  CATHEDRAI_ARM_ARCH: ${{ inputs.arm_arch || vars.CATHEDRAI_ARM_ARCH || 'armv8.2-a+dotprod' }}
  CATHEDRAI_NDK: "27.2.12479018"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;${CATHEDRAI_NDK}" "cmake;3.22.1"
      - name: Fetch llama.cpp (requested ${{ env.LLAMA_TAG }})
        run: |
          REPO=https://github.com/ggml-org/llama.cpp
          REQ="$LLAMA_TAG"
          USE="$REQ"
          # llama.cpp does not publish a tag for every build number, so a missing
          # tag falls back to the closest older one that exists.
          if [[ "$REQ" =~ ^b[0-9]+$ ]]; then
            git ls-remote --tags --refs "$REPO" 'refs/tags/b*' | sed 's#.*refs/tags/##' | grep -E '^b[0-9]+$' | sort -V > tags.txt
            echo "Found $(wc -l < tags.txt) release tags"
            if ! grep -qx "$REQ" tags.txt; then
              N="${REQ#b}"
              USE=$(awk -v n="$N" '{ if (substr($0,2)+0 <= n) last=$0 } END { print last }' tags.txt)
              [ -z "$USE" ] && USE=$(head -n1 tags.txt)
              echo "::warning::Tag $REQ does not exist upstream. Using closest older tag $USE instead."
            fi
          fi
          echo "Building llama.cpp $USE"
          git clone --depth 1 --branch "$USE" "$REPO" third_party/llama.cpp
          echo "LLAMA_TAG=$USE" >> "$GITHUB_ENV"
      - run: npm install
      - run: npx cap add android
      - name: Inject native engine, diagnostics and build config
        run: python3 native-android/patch-android.py
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cathedrai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
