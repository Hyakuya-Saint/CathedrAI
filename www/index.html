function md(s){const cb=[];s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{cb.push(`<pre><button onclick="navigator.clipboard&&navigator.clipboard.writeText(this.nextSibling.textContent);toast('Copied')">copy · ${l||'text'}</button><code>${esc(c.replace(/\n$/,''))}</code></pre>`);return'\n\u0000'+(cb.length-1)+'\u0000\n'});
const il=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>'),
OL=/^\s*\d+[.)]\s/,UL=/^\s*[-*•]\s/,isB=l=>OL.test(l)||UL.test(l)||/^(#{1,3}\s|>|\||\u0000)/.test(l);
let o='',A=s.split('\n'),i=0,m;
while(i<A.length){const l=A[i];if(!l.trim()){i++;continue}
if(m=l.match(/^\u0000(\d+)\u0000$/)){o+=cb[m[1]];i++}
else if(m=l.match(/^#{1,3}\s+(.*)/)){o+=`<h3>${il(m[1])}</h3>`;i++}
else if(OL.test(l)){const st=+l.match(/\d+/)[0];let it='';while(i<A.length&&OL.test(A[i]))it+=`<li>${il(A[i++].replace(/^\s*\d+[.)]\s+/,''))}</li>`;o+=`<ol start="${st}">${it}</ol>`}
else if(UL.test(l)){let it='';while(i<A.length&&UL.test(A[i]))it+=`<li>${il(A[i++].replace(UL,''))}</li>`;o+=`<ul>${it}</ul>`}
else if(l[0]=='>'){let q=[];while(i<A.length&&A[i][0]=='>')q.push(il(A[i++].replace(/^>\s?/,'')));o+=`<blockquote>${q.join('<br>')}</blockquote>`}
else if(l[0]=='|'&&/^\|?[\s:|-]+\|?$/.test(A[i+1]||'')){const row=(r,t)=>'<tr>'+r.trim().replace(/^\||\|$/g,'').split('|').map(c=>`<${t}>${il(c.trim())}</${t}>`).join('')+'</tr>';let r=row(l,'th');i+=2;while(i<A.length&&A[i][0]=='|')r+=row(A[i++],'td');o+=`<div style="overflow-x:auto"><table>${r}</table></div>`}
else{let p=[];while(i<A.length&&A[i].trim()&&(!isB(A[i])||!p.length))p.push(il(A[i++]));o+=`<p>${p.join('<br>')}</p>`}}

 o.push('\n== Incidents ==',d.incidents||'(none)');
 if(TST.length){o.push('\n== Self-test ==');TST.forEach(t=>o.push((t.ok?'PASS ':'FAIL ')+t.n+' ('+t.ms+' ms): '+t.d))}
 o.push('\n== Native log ==',d.nativeLog||'(empty)','\n== App log ==',d.appLog||'(empty)','\n== UI log ==',JL.slice(-60).join('\n'));return o.join('\n')}
async function copyReport(){const t=diagReport();try{await navigator.clipboard.writeText(t);toast('Report copied')}catch(e){shareReport()}}
async function shareReport(){const c=CA();if(!c)return toast('Sharing works inside the Android app');try{await c.shareText({text:diagReport()})}catch(e){toast('Share failed: '+(e.message||e))}}
async function clearDiag(){const c=CA();if(c){await c.clearDiagnostics();JL.length=0;TST=[];await diagLoad();toast('Logs cleared')}}
async function selfTest(){if(tbusy||busy)return toast('Busy: wait for the current task');if(!CA())return toast('Needs the Android app');tbusy=true;TST=[];
 const step=async(n,fn)=>{const r={n,ok:false,d:'running…',ms:0},t0=performance.now();TST.push(r);dgPaint();try{r.d=(await fn())||'';r.ok=true}catch(e){r.d=String(e.message||e)}r.ms=Math.round(performance.now()-t0);dgPaint();return r.ok};
 const am=models.find(x=>x.id==act&&x.st=='ready');dlog('selftest','start');
 (await step('Engine library',async()=>{await diagLoad();const e=DG.engine;if(!e.loaded)throw new Error(e.loadError||'not loaded');return e.sysinfo.slice(0,160)}))&&
 (await step('CPU compatibility',async()=>{const c=DG.cpu,a=DG.engine.arch;if(c.known&&/dotprod/.test(a)&&!c.dotprod)throw new Error('CPU has no dotprod but the engine needs it');return 'build '+a+' · dotprod '+c.dotprod+' · i8mm '+c.i8mm}))&&
 (await step('Active model file',async()=>{if(!am)throw new Error('No Saint appointed');const r=await CA().listModels(),f=r.models.find(x=>x.file==am.file&&!x.partial);if(!f)throw new Error('File missing from app storage: '+am.file);if(f.bad)throw new Error('Header unreadable: '+f.bad);return am.file+' · '+fmtB(f.size)+' · '+metaTxt(f.meta)}))&&
 (await step('Load model',async()=>{await ensureLoaded(am);return 'context '+loaded.info.ctx+' · '+loaded.info.desc+' · '+loaded.info.ms+' ms · template '+loaded.info.template}))&&
 (await step('Generate 16 tokens',async()=>{let txt='';curGen={on:t=>txt+=t};try{const r=await CA().generate({messages:[{role:'user',content:'Say hello in five words.'}],temp:0,topP:1,topK:1,repeat:1,maxTokens:16,seed:1});if(!r.ok)throw new Error(r.error);return `${r.gen} tokens · ${r.tps} tok/s generating · ${r.pps} tok/s reading · “${txt.trim().slice(0,80)}”`}finally{curGen=null}}));
 dlog('selftest','done '+TST.map(t=>(t.ok?'PASS':'FAIL')+':'+t.n).join(', '));tbusy=false;await diagLoad()}
function diagView(){const d=DG;let h=`<div class="wrap"><h1 class="t">Diagnostics</h1><p>If anything breaks, tap <b>Share report</b> and send it over: it holds everything needed to see what happened.</p>
<div><button class="btn" onclick="diagLoad()">Refresh</button><button class="btn" onclick="shareReport()">Share report</button><button class="btn g" onclick="copyReport()">Copy report</button><button class="btn g" onclick="selfTest()" ${tbusy?'disabled':''}>Run self-test</button><button class="btn g" onclick="clearDiag()">Clear logs</button></div>`;
if(!d)return h+'<p style="margin-top:12px">Collecting…</p></div>';
if(d.preview)return h+'<div class="card"><p>This is the browser preview. Diagnostics need the Android app.</p></div></div>';
if(d.error)return h+`<div class="card"><p class="er">${esc(d.error)}</p></div></div>`;
const e=d.engine,dv=d.device,cp=d.cpu,st=d.storage;
if(TST.length)h+=`<div class="card"><h4>Self-test</h4>`+TST.map(t=>`<div class="kv"><b class="${t.ok?'ok':t.d=='running…'?'':'bad'}">${t.ok?'PASS':t.d=='running…'?'…':'FAIL'}</b><span>${esc(t.n)}: ${esc(t.d)}${t.ms?' ('+t.ms+' ms)':''}</span></div>`).join('')+`</div>`;
h+=`<div class="card"><h4>Engine</h4>${kv('Library',e.loaded?'loaded':'FAILED: '+e.loadError,e.loaded?'ok':'bad')}${kv('Model in memory',e.modelLoaded?e.modelPath.split('/').pop():'none')}${kv('llama.cpp',e.llamaTag)}${kv('Compiled for',e.arch)}${kv('App',e.appVersion)}</div>
<div class="card"><h4>Device</h4>${kv('Phone',dv.model)}${kv('Android',dv.android)}${kv('CPU',dv.abi+' · '+dv.cores+' cores')}${kv('CPU features',`dotprod ${cp.dotprod?'yes':'no'} · i8mm ${cp.i8mm?'yes':'no'} · fp16 ${cp.fp16?'yes':'no'}`,cp.known&&!cp.dotprod?'bad':'')}${kv('RAM',fmtB(dv.ramAvail)+' free of '+fmtB(dv.ramTotal)+(dv.lowMemory?' (LOW)':''))}${kv('Storage',fmtB(st.free)+' free · models use '+fmtB(st.used))}</div>
<div class="card"><h4>Model files on disk</h4>${(st.files||[]).map(f=>kv(f.file,fmtB(f.size))).join('')||'<small>none</small>'}</div>
<div class="card"><h4>Previous runs</h4>${d.incidents?`<div class="lg">${esc(d.incidents)}</div>`:'<small class="ok">No crashes or interrupted operations recorded.</small>'}<small>How Android says earlier runs ended:</small><div class="lg">${esc((d.exits||[]).join('\n'))}</div></div>
<details open><summary>Engine log</summary><div class="lg">${esc(d.nativeLog||'(empty)')}</div></details><details><summary>App log</summary><div class="lg">${esc(d.appLog||'(empty)')}</div></details><details><summary>UI log</summary><div class="lg">${esc(JL.slice(-60).join('\n')||'(empty)')}</div></details></div>`;return h}
async function startup(){const c=CA();if(!c)return;await reconcile();try{const n=await c.getStartupNotice();if(n&&n.op){dlg(`<h4>Last time ended unexpectedly</h4><p>CathedrAI was closed by Android while it was doing:</p><p style="margin:8px 0;user-select:text;word-break:break-word">${esc(n.op)}</p><p style="font-size:12px">${esc(n.exit||'')}</p><p style="margin-top:8px;font-size:12px">The details were saved in Diagnostics.</p><div class="ac"><button class="btn g" onclick="cl()">Dismiss</button><button class="btn" onclick="cl();go('diag')">Open Diagnostics</button></div>`)}}catch(e){}}
/* ---------- views ---------- */
function msgIn(m,i){if(m.r=='u')return `${attH(m.a)}${md(m.t||'')}<div class="tb"><button onclick="editp(${i})">${ic('edit',14)}Edit</button><button onclick="cp(${i})">${ic('copy',14)}Copy</button></div>`;
 let t=m.t||'';if(m.live&&(t.match(/```/g)||[]).length%2)t+='\n```';
 return (m.live&&!m.t?`<p class="stat">${esc(m.status||'…')}</p>`:md(t))+(m.live?'':`<div class="tb"><button onclick="regen(${i})">${ic('regen',14)}Regenerate</button><button onclick="quote(${i})">${ic('quote',14)}Quote</button><button onclick="cp(${i})">${ic('copy',14)}Copy MD</button><button onclick="fork(${i})">${ic('fork',14)}Fork</button>${m.s?`<small class="ms">${esc(m.s)}</small>`:''}</div>`)}
function updMsg(i){const el=document.getElementById('m'+i),V=$('#view');if(!el||!C.m[i])return;const near=V.scrollHeight-V.scrollTop-V.clientHeight<140;el.innerHTML=msgIn(C.m[i],i);if(near)V.scrollTop=V.scrollHeight}
const sched=f=>{if(sched.p)return;sched.p=1;requestAnimationFrame(()=>{sched.p=0;f()})};
const attH=a=>(a||[]).map(x=>x.img?`<img class="ai" src="${x.img}">`:`<span class="ach">${ic('file',14)}${esc(x.name)}</span>`).join('');
function render(){const V=$('#view');
if(view=='chat'){const ms=C.m;
V.innerHTML=ms.length?`<div class="wrap">${ms.map((m,i)=>`<div class="msg ${m.r=='u'?'u':'a'}" id="m${i}">${msgIn(m,i)}</div>`).join('')}</div>`
:`<div id="hero"><h2>Greetings, Apostle.</h2><p>Appoint your Saint to begin command execution.</p><p style="font-size:12px">Serving as ${PR[prof].n} · ${FAC[fac].n}</p><div class="chips">${Object.keys(E).filter(k=>k!='talk').map(e=>`<button class="chip" onclick="setEmo('${e}')">${e}</button>`).join('')}</div></div>`;
V.scrollTop=V.scrollHeight}
else if(view=='diag')V.innerHTML=diagView();
else if(view=='proj')V.innerHTML=`<div class="wrap"><h1 class="t">Projects</h1><p>Appoint a project to show its folder in Discussion. Stored projects stay here. Discussions outside any project live in General.</p>`+folders.filter(f=>f.id!='g').map(f=>{const cs=chats.filter(c=>c.f==f.id);return`<div class="card"><h4>${ic('folder')}${esc(f.name)}<small>${cs.length} discussions · ${f.on?'Appointed':'Stored'}</small></h4>${cs.map(c=>`<div class="ci" onclick="openChat(${chats.indexOf(c)})"><span>${esc(c.t)}</span></div>`).join('')}<button class="btn" onclick="tgl('${f.id}')">${f.on?'Unappoint':'Appoint'}</button><button class="btn g" onclick="newChat('${f.id}')">New discussion</button><button class="btn g" onclick="ren('${f.id}')">Rename</button><button class="btn g" onclick="delF('${f.id}')">Delete</button></div>`}).join('')+`<button class="btn" onclick="newF()">${ic('plus',16)}New project</button></div>`;
else if(view=='hub')V.innerHTML=hubView();
else{const p=PR[prof];V.innerHTML=`<div class="wrap"><h1 class="t">Hierarchy</h1><label>Rank</label><button class="sb" onclick="rankMenu(this)">${ic('crown',16)}<span>${p.n}</span>${ic('chev',14)}</button><p style="margin-top:6px">${p.d}</p><label>System prompt</label><textarea style="width:100%" rows="4" oninput="PR[prof].p=this.value;save()">${esc(p.p)}</textarea><button class="btn g" onclick="PR[prof].p=PR[prof].p0;render();save()" ${p.p==p.p0?'disabled':''}>${ic('undo',16)}Revert to default</button><label>Memory store</label><textarea style="width:100%" rows="3" placeholder="Facts CathedrAI should always remember…" oninput="mem=this.value;save()">${esc(mem)}</textarea></div>`}
dock()}
/* ---------- chat ---------- */
let curGen=null,idleT=null,loaded=null;
try{const c=CA();if(c){c.addListener('token',e=>{curGen&&curGen.on(e.t)});c.addListener('prefill',e=>{curGen&&curGen.pre&&curGen.pre(e.done,e.total)})}}catch(e){}
function sysP(){let t=PR[prof].p;if(mem.trim())t+='\n\nAlways keep these facts in mind:\n'+mem.trim();return t}
function histMsgs(ms,F){const out=[{role:'system',content:sysP()}],cap=Math.floor(F.ctx*1.5);
 const add=(role,content)=>{const l=out[out.length-1];if(l.role==role)l.content+='\n\n'+content;else out.push({role,content})};
 for(const m of ms){if(m.err)continue;
  if(m.r=='u'){let t=m.t||'';for(const a of m.a||[]){if(a.text!=null)t+=`\n\n[Attached file: ${a.name}]\n${a.text.slice(0,cap)}${a.text.length>cap?'\n[…truncated]':''}`;else t+=`\n\n[Attached: ${a.name}. This kind of file cannot be read yet.]`}
   add('user',t.trim()||'(empty)')}
  else if(m.t&&m.t!='Stopped.')add('assistant',m.t)}
 return out}
async function ensureLoaded(am,say){const F=FAC[fac],thr=cfg.threads||0;
 if(loaded&&loaded.path==am.path&&loaded.req==F.ctx&&loaded.thr==thr)return;
 say&&say('Loading '+am.n+'… (the first load can take a few seconds)');dlog('engine','load '+am.file+' ctx='+F.ctx+' thr='+thr);loaded=null;
 const r=await CA().loadModel({path:am.path,nCtx:F.ctx,threads:thr});if(!r.ok)throw new Error(r.error||'load failed');
 loaded={path:am.path,req:F.ctx,thr,info:r};dlog('engine','loaded ctx='+r.ctx+' template='+r.template+' in '+r.ms+'ms')}
async function unloadIdle(){if(busy||!loaded)return;try{await CA().unloadModel()}catch(e){}loaded=null;dlog('engine','idle unload')}
function setBusy(b){busy=b;$('#send').innerHTML=b?ic('stop',16)+'STOP':'EXECUTE'+ic('send',16)}
async function ask(q,at,files){if(busy)return;if(at==null&&!q.trim()&&!(files&&files.length))return;
const c=C,F=FAC[fac];setBusy(true);stop=false;clearTimeout(idleT);
if(at==null){c.m.push({r:'u',t:q,a:files||[]});if(c.m.length==1)c.t=(q||files[0].name).slice(0,28)}
const idx=at??c.m.length,m={r:'a',t:'',status:'Preparing…',live:true};c.m[idx]=m;nav();render();
const upd=()=>{if(C==c&&view=='chat')updMsg(idx)};let first=true;
try{
 if(!CA())throw new UserErr('The AI engine only runs inside the Android app. This browser preview has no model.');
 const am=models.find(x=>x.id==act&&x.st=='ready');
 if(!am)throw new UserErr('No Saint is appointed yet. Open **Appoint Your Saint**, then download or import a model.');
 setEmo('think');
 await ensureLoaded(am,s=>{m.status=s;upd()});
 if(stop)throw new UserErr('Stopped.');
 const hist=histMsgs(c.m.slice(0,idx),F);m.status='Reading your message…';upd();
 curGen={on:t=>{if(first){first=false;m.status='';setEmo('talk');talking=true}m.t+=t;sched(upd)},pre:(d,t)=>{if(first){m.status=`Reading your message… ${d}/${t} tokens`;sched(upd)}}};
 const r=await CA().generate({messages:hist,temp:F.temp,topP:F.top,topK:40,repeat:1.1,maxTokens:cfg.maxTok,seed:-1});
 if(!r.ok)throw new Error(r.error||'generation failed');
 if(!m.t)m.t=r.reason=='user'?'Stopped.':'(The Saint returned an empty reply.)';
 m.s=`${r.gen} tokens · ${r.tps} tok/s`+(r.reused?` · ${r.reused} cached`:'')+(r.trimmed?` · ${r.trimmed} old messages dropped`:'')+(r.reason=='length'?' · reply limit reached':'')+(r.reason=='ctx'?' · context full':'');
 dlog('chat',m.s)
}catch(e){const msg=(e&&e.message)||String(e);dlog('chat','error: '+msg);
 if(e instanceof UserErr)m.t=msg;else m.t='⚠ '+msg+'\n\nOpen **Diagnostics** to see the engine log.';
 m.err=true;if(m.t=='Stopped.')m.err=false}
curGen=null;m.live=false;m.status='';talking=false;setEmo('idle');setBusy(false);stop=false;save();
idleT=setTimeout(unloadIdle,300000);if(C==c&&view=='chat')render()}
function bn(){$('#ban').innerHTML=(pend?`<div class="bn"><span>${pend.k=='edit'?'Editing prompt (sending replaces it and later replies)':'Replying to: '+esc(pend.t)}</span><button class="ib" style="padding:2px" onclick="cancel()">${ic('x',14)}</button></div>`:'')+(att.length?`<div style="margin-bottom:6px">${att.map((a,i)=>`<span class="ch" title="${a.text!=null?'text read: '+a.text.length+' characters':'not readable by the Saint yet'}">${a.img?`<img src="${a.img}">`:ic('file',16)}<span>${esc(a.name)} · ${a.text!=null?'read':'not read'}</span><button onclick="rmA(${i})">${ic('x',12)}</button></span>`).join('')}</div>`:'')}
const rmA=i=>{att.splice(i,1);bn()};

async function readAtt(f){const o={name:f.name,size:f.size,img:f.type.startsWith('image/')?URL.createObjectURL(f):null};
 if(!o.img&&(/^text\//.test(f.type)||/\.(txt|md|json|csv|tsv|js|ts|jsx|tsx|py|java|kt|c|h|cpp|hpp|cs|go|rs|rb|php|html|css|xml|ya?ml|toml|ini|sh|sql|log|tex|swift|lua|r)$/i.test(f.name))&&f.size<=600000){try{const t=await f.text();if(!/\u0000/.test(t.slice(0,2000)))o.text=t}catch(e){}}
 return o}
for(const id of['fPhoto','fCam','fFile'])$('#'+id).onchange=async e=>{const fs=[...e.target.files];e.target.value='';let bad=0;for(const f of fs){const a=await readAtt(f);if(a.text==null)bad++;att.push(a)}bn();if(bad)toast('Only text and code files can be read for now')};
function send(){if(busy){stop=true;try{CA()&&CA().stopGeneration()}catch(e){}return}let v=$('#in').value.trim();if(!v&&!att.length)return;

const f=att;pend=null;att=[];bn();$('#in').value='';$('#in').style.height='auto';view='chat';ask(v,null,f)}
function regen(i){if(i>0)ask(C.m[i-1].t||'',i)}

else if(e.key=='Enter'){const t=e.target,ln=t.value.slice(0,t.selectionStart).split('\n').pop(),n=ln.match(/^(\s*)(\d+)([.)])\s/),u=ln.match(/^(\s*)([-*•])\s/);
if(n){e.preventDefault();ins(t,'\n'+n[1]+(+n[2]+1)+n[3]+' ')}else if(u){e.preventDefault();ins(t,'\n'+u[1]+u[2]+' ')}}};

$('#tg').innerHTML=ic('menu',20);$('#newc').innerHTML=ic('plus',20);$('#att').innerHTML=ic('clip',20);$('#mic').innerHTML=ic('mic');$('#live').innerHTML=ic('live');setBusy(false);

if(NAT){const A=PL('App');A&&A.addListener('backButton',()=>{if(pop)return closeMenu();if($('#modal').style.display=='grid')return cl();if(pend||att.length)return cancel();if(view!='chat')return go('chat');A.exitApp()});
try{PL('StatusBar').setBackgroundColor({color:'#0B0809'});PL('StatusBar').setStyle({style:'DARK'})}catch(e){}}
if(innerWidth<720)$('#side').classList.add('min');
nav();render();document.fonts&&document.fonts.ready.then(dock);startup();
