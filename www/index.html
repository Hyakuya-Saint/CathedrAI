function md(s){const cb=[];s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{cb.push(`<pre><button onclick="navigator.clipboard&&navigator.clipboard.writeText(this.nextSibling.textContent);toast('Copied')">copy · ${l||'text'}</button><code>${esc(c.replace(/\n$/,''))}</code></pre>`);return'\n\u0000'+(cb.length-1)+'\u0000\n'});
const il=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>'),
OL=/^\s*\d+[.)]\s/,UL=/^\s*[-*•]\s/,isB=l=>OL.test(l)||UL.test(l)||/^(#{1,3}\s|>|\||\u0000)/.test(l);
let o='',A=s.split('\n'),i=0,m;
while(i<A.length){const l=A[i];if(!l.trim()){i++;continue}
if(m=l.match(/^\u0000(\d+)\u0000$/)){o+=cb[m[1]];i++}
else if(m=l.match(/^#{1,3}\s+(.*)/)){o+=`<h3>${il(m[1])}</h3>`;i++}
else if(OL.test(l)){const st=+l.match(/\d+/)[0];let it='';while(i<A.length&&OL.test(A[i]))it+=`<li>${il(A[i++].replace(/^\s*\d+[.)]\s+/,''))}</li>`;o+=`<ol start="${st}">${it}</ol>`}
else if(UL.test(l)){let it='';while(i<A.length&&UL.test(A[i]))it+=`<li>${il(A[i++].replace(UL,''))}</li>`;o+=`<ul>${it}</ul>`}

else if(l[0]=='|'&&/^\|?[\s:|-]+\|?$/.test(A[i+1]||'')){const row=(r,t)=>'<tr>'+r.trim().replace(/^\||\|$/g,'').split('|').map(c=>`<${t}>${il(c.trim())}</${t}>`).join('')+'</tr>';let r=row(l,'th');i+=2;while(i<A.length&&A[i][0]=='|')r+=row(A[i++],'td');o+=`<div style="overflow-x:auto"><table>${r}</table></div>`}

function histMsgs(ms,F,extra,wctx){const out=[{role:'system',content:sysP(F,extra)}],cap=Math.floor(F.ctx*1.5);

   if(k==ms.length-1&&wctx)t+=webPrompt(wctx);add('user',t.trim()||'(empty)')}
  else if(m.t&&m.t!='Stopped.')add('assistant',m.cv?m.t+'\n```'+(m.cv.kind=='doc'?'canvas-doc':m.cv.kind=='slides'?'canvas-slides':'html')+'\n'+m.cv.src+'\n```':m.t)});
 return out}
async function ensureLoaded(am,say){const F=FAC[fac],thr=cfg.threads||0,pj=am.projPath||'';

 say&&say('Loading '+am.n+'… (the first load can take a few seconds)');dlog('engine','load '+am.file+' ctx='+F.ctx+' thr='+thr+(pj?' vision':''));loaded=null;
 const r=await CA().loadModel({path:am.path,nCtx:F.ctx,threads:thr,proj:pj});if(!r.ok)throw new Error(r.error||'load failed');
 loaded={path:am.path,req:F.ctx,thr,pj,info:r};dlog('engine','loaded ctx='+r.ctx+' arch='+r.arch+' vision='+r.vision+' template='+r.template+' in '+r.ms+'ms');

 if(stop)throw new UserErr('Stopped.');

  pre:(d,t)=>{if(first){m.status=imgs.length&&d==t?'Looking at the image…':`Reading your message… ${d}/${t} tokens`;sched(upd)}}};

 if(r.imgIgnored)toast('The image was ignored: no vision file is loaded');
 dlog('chat',m.s)
}catch(e){const msg=(e&&e.message)||String(e);dlog('chat','error: '+msg);

curGen=null;m.live=false;m.status='';talking=false;clearTimeout(tt);
{const em=m.err?'sad':mood;setEmo(em&&E[em]?em:'idle');if(em&&E[em]&&em!='idle')tt=setTimeout(()=>setEmo('idle'),2800)}
